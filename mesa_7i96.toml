# Physical-backend configuration derived from my_LinuxCNC_machine. The typed
# NRT loader, active StepGen board diagnostic, and initial physical-backend
# process consume this schema. The physical process is not yet the
# application's default Real target or physically commissioned.
#
# Machine topology, trajectory behavior, limits, homing positions, logical
# input identities, the authoritative servo period, and real-time host policy
# remain in machine.toml.

[motion]
driver = "mesa_hostmot2"
address = "10.10.10.10"
expected_board = "7i96"

# LinuxCNC: hm2_7i96.0.watchdog.timeout_ns = 5000000
watchdog_timeout = 0.005

# fieldinN is the unmodified level of 7I96 isolated input N.
#
# Logical input IDs come from machine.toml:
#   in0 = tool_probe
#   in1 = shared_home
#   in2 = y2_home
#   in3 = external_enable
#
# The LinuxCNC configuration maps:
#   gpio.001.in_not -> shared home
#   gpio.002.in     -> external machine-enable permission
#   gpio.003.in_not -> probe channel 0
#   gpio.004.in_not -> probe channel 1
#   gpio.005.in_not -> Y2 home
#
# Its physical probe is the AND of the two active-low channels, debounced for
# 10 one-millisecond servo samples. The PyVCP manual probe trigger is
# intentionally excluded because synthetic GUI policy does not belong in the
# physical backend.
io_program = """
not in1, fieldin1

mov in3, fieldin2

not r0, fieldin3
not r1, fieldin4
and r2, r0, r1
debounce in0, r2, 10ms

not in2, fieldin5
"""

[motion.safety]
enable_input = "external_enable"
enable_level = true

# These are the units of the physical mechanism and do not depend on the
# machine.toml internal machine unit. The NRT bootstrap converts each
# steps_per_unit value once into the executor's steps-per-machine-unit scale.
[motion.units]
linear = "mm"
angular = "degree"

# LinuxCNC uses the same timing for all four configured StepGens.
[motion.step_timing]
step_length = 0.000005
step_space = 0.000005
direction_setup = 0.000010
direction_hold = 0.000010

# Latch all StepGen accumulators on DPLL timer 1, 500 microseconds before the
# FPGA's predicted HostMot2 read phase. This exceeds the observed roughly
# 275 microsecond non-PREEMPT_RT host variation. The physical-backend loader
# must derive the DPLL base frequency from machine.toml's authoritative servo
# period.
[motion.dpll]
enabled = true
stepgen_timer = 1
stepgen_sample_offset = -0.000500
# Preserve 100 microseconds of margin inside the 500 us latch lead. Require
# 100 consecutive cycles in this guard before allowing a nonzero StepGen rate.
maximum_phase_error = 0.000400
convergence_cycles = 100

# X: LinuxCNC joint 0 -> hm2_7i96.0.stepgen.01
[[motion.stepgens]]
joint = 0
channel = 1
steps_per_unit = 160.0
invert_direction = false
position_gain = 1000.0
maximum_correction_velocity = 5.0
maximum_generated_step_error = 2.0

# Y1: LinuxCNC joint 1 -> hm2_7i96.0.stepgen.02
[[motion.stepgens]]
joint = 1
channel = 2
steps_per_unit = 160.0
invert_direction = false
position_gain = 1000.0
maximum_correction_velocity = 5.0
maximum_generated_step_error = 2.0

# Y2: LinuxCNC joint 2 -> hm2_7i96.0.stepgen.03
[[motion.stepgens]]
joint = 2
channel = 3
steps_per_unit = 160.0
invert_direction = false
position_gain = 1000.0
maximum_correction_velocity = 5.0
maximum_generated_step_error = 2.0

# Z: LinuxCNC joint 3 -> hm2_7i96.0.stepgen.00
[[motion.stepgens]]
joint = 3
channel = 0
steps_per_unit = 160.0
invert_direction = false
position_gain = 1000.0
maximum_correction_velocity = 5.0
maximum_generated_step_error = 2.0

# StepGen channel 4 is unused. The LinuxCNC configuration has no Mesa isolated
# field outputs, so this proposal deliberately has no motion.field_outputs
# entries.
#
# The metric scale is the exact conversion of the previous LinuxCNC setting:
# 4064 steps/inch / 25.4 mm/inch = 160 steps/mm. With the machine's 5 mm-pitch
# ball screws, this is 800 commanded steps per screw revolution.
#
# The position loop uses commanded velocity as feed-forward and P=1000
# proportional correction. Correction is limited to 5 mm/s and exists only to
# remove small host/FPGA phase discrepancies. More than two generated steps of
# disagreement is a fault rather than a request for aggressive catch-up.
#
# GPIO 2 is an enable-permission input in the existing wiring. The physical
# executor requires in3 to remain active and latches a fault with safe outputs
# when it becomes inactive. This userspace interlock does not replace the
# machine's hardwired E-stop, STO/drive-enable chain, or Mesa watchdog.
#
# The generic HostMot2 cyclic layer and active board diagnostic implement this
# DPLL behavior. The diagnostic combines this file with machine.toml's
# authoritative Real servo period.

# The existing machine drives a Huanyang VFD independently of Mesa over
# /dev/ttyUSB0 at 9600 baud with no parity. A bounded serial/Modbus physical-I/O
# integration is not implemented yet. Its eventual backend configuration
# should have this shape:
#
# [spindle]
# driver = "huanyang_modbus"
# device = "/dev/ttyUSB0"
# baud = 9600
# parity = "none"
# maximum_speed = 24000
